<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#111111" media="(prefers-color-scheme: dark)">
  <title>Anteckningar</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-maskable-512.png">
  <link rel="stylesheet" href="app.css">
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <main id="editor-view">
    <header>
      <button id="show-list" type="button">Anteckningar</button>
      <button id="delete" type="button" hidden>Ta bort</button>
    </header>
    <textarea id="editor" aria-label="Anteckning" autofocus></textarea>
  </main>
  <main id="list-view" hidden>
    <header>
      <button id="new" type="button">Ny</button>
    </header>
    <ul id="notes"></ul>
  </main>
</body>
</html>
