<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#111111" media="(prefers-color-scheme: dark)">
  <title>Anteckningar</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-maskable-512.png">
  <link rel="stylesheet" href="app.css">
  <link rel="modulepreload" href="js/store.js">
  <link rel="modulepreload" href="js/supabase.js">
  <link rel="modulepreload" href="js/ai.js">
  <link rel="modulepreload" href="js/sync.js">
  <link rel="modulepreload" href="js/lock.js">
  <link rel="modulepreload" href="js/ui/motion.js">
  <link rel="modulepreload" href="js/ui/editor.js">
  <link rel="modulepreload" href="js/ui/list.js">
  <link rel="modulepreload" href="js/ui/signin.js">
  <link rel="modulepreload" href="js/ui/pin.js">
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <main id="editor-view">
    <header>
      <button id="show-list" type="button">Anteckningar</button>
      <div>
        <button id="original" type="button" hidden>Original</button>
        <button id="ai" type="button" aria-expanded="false" aria-controls="ai-menu" hidden>AI</button>
        <button id="delete" type="button" hidden>Ta bort</button>
      </div>
    </header>
    <div id="ai-menu" class="bar" hidden>
      <button type="button" data-action="spellcheck">Rätta</button>
      <button type="button" data-action="rewrite">Renskriv</button>
      <button type="button" data-action="summarize">Summera</button>
    </div>
    <p id="status" class="bar" role="status" hidden></p>
    <textarea id="editor" aria-label="Anteckning" autofocus></textarea>
  </main>
  <main id="list-view" hidden>
    <header>
      <button id="new" type="button">Ny</button>
      <div>
        <button id="show-signin" type="button" hidden>Synka</button>
        <button id="lock" type="button" hidden>Privat</button>
      </div>
    </header>
    <ul id="notes"></ul>
    <datalist id="categories"></datalist>
  </main>
  <main id="signin-view" hidden>
    <header>
      <button id="signin-back" type="button">Anteckningar</button>
    </header>
    <form id="signin" class="form">
      <p id="signin-text"></p>
      <input id="signin-input" required>
      <button id="signin-button" type="submit"></button>
      <p id="signin-status" role="status"></p>
    </form>
  </main>
  <main id="pin-view" hidden>
    <header>
      <button id="pin-back" type="button">Anteckningar</button>
    </header>
    <form id="pin" class="form">
      <p id="pin-text"></p>
      <input id="pin-input" type="password" inputmode="numeric" autocomplete="off" aria-label="PIN-kod" required>
      <button id="pin-button" type="submit"></button>
      <button id="pin-forgot" type="button" hidden>Glömt koden?</button>
      <p id="pin-status" role="status"></p>
    </form>
  </main>
</body>
</html>
